<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>At least watch this gif first</title>
    <link rel="icon" type="image/png" href="/src/icon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: whitesmoke;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20%;
        height: 20%;
      }

      .splash img {
        width: 80%;
        height: auto;
        display: block;
        object-fit: contain;
        pointer-events: none; /* Mencegah drag, klik kanan, dan interaksi pada gambar */
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img
        src="/src/logo_loading.gif"
        alt="Loading animation"
        draggable="false"
        oncontextmenu="return false;"
      />
    </div>

    <script src="index.js"></script>
  </body>
</html>
